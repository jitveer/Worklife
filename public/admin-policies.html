<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Company Policies | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #c3e2d1;
            min-height: 100vh;
        }

        /* ==========================================================================
           Header
           ========================================================================== */
        .header {
            background-color: #52af8d;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            height: 60px;
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-box {
            background-color: white;
            color: black;
            font-weight: bold;
            font-size: 18px;
            padding: 5px 11px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .worklife-text {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header select {
            background-color: white;
            border: 1px solid white;
            color: rgb(10, 10, 10);
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .header .profile {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .username {
            font-weight: 500;
            font-size: 14px;
        }

        .logout {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .logout:hover {
            opacity: 0.8;
        }

        /* ==========================================================================
           Main Layout & Left Panel - Desktop
           ========================================================================== */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px 20px;
            gap: 20px;
            max-width: 1480px;
            margin: 0 auto;
            width: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .left-panel button {
            width: 110px;
            height: 100px;
            padding: 10px 6px;
            font-weight: bold;
            border: none;
            color: white;
            border-radius: 0px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .left-panel button div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .left-panel button i {
            display: block;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .left-panel button span {
            display: block;
            font-size: 13px;
            line-height: 1.2;
            word-break: break-word;
        }

        .left-panel button:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .left-panel .btn-hr {
            background-color: #a493b9;
        }

        .left-panel .btn-finance {
            background-color: #c78864;
        }

        .left-panel .btn-it {
            background-color: #863f33;
        }

        .left-panel .btn-travel {
            background-color: #5e77c8;
        }

        .left-panel .btn-pm {
            background-color: #15ac7f;
        }

        .left-panel .btn-reports {
            background-color: #82b435;
        }

        /* ==========================================================================
           Center Section - Simple Clean List Layout
           ========================================================================== */
        .center-content {
            flex: 1;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 24px 28px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            min-width: 0;
            margin-top: 10px;
            width: 100%;
        }

        /* Page Heading */
        .page-heading {
            font-size: 22px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-heading-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .policy-badge-count {
            font-size: 13px;
            font-weight: 600;
            background-color: #e6f4ea;
            color: #1e7e34;
            padding: 3px 10px;
            border-radius: 12px;
        }

        /* Top Action Bar: Left Search & Right Add */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box-wrapper {
            position: relative;
            flex: 1;
            max-width: 380px;
            min-width: 200px;
        }

        .search-box-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c98a4;
            font-size: 14px;
        }

        .search-box {
            width: 100%;
            padding: 9px 12px 9px 36px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus {
            border-color: #52af8d;
            box-shadow: 0 0 0 3px rgba(82, 175, 141, 0.2);
        }

        .btn-add-policy {
            background-color: #52af8d;
            color: white;
            border: none;
            padding: 9px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-add-policy:hover {
            background-color: #429878;
        }

        /* Policy List Table (Desktop view) */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .policy-list-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 650px;
        }

        .policy-list-table th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 2px solid #dee2e6;
            text-align: left;
            white-space: nowrap;
        }

        .policy-list-table td {
            padding: 14px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
            color: #333333;
        }

        .policy-list-table tr:hover td {
            background-color: #fafbfc;
        }

        .policy-item-title {
            font-weight: 600;
            color: #212529;
            margin-bottom: 3px;
            word-break: break-word;
        }

        .policy-item-desc {
            font-size: 13px;
            color: #6c757d;
            line-height: 1.45;
            word-break: break-word;
        }

        .attachment-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #fff5f5;
            color: #dc3545;
            border: 1px solid #f5c6cb;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s;
            max-width: 100%;
        }

        .attachment-link span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .attachment-link:hover {
            background-color: #f8d7da;
            color: #a71d2a;
        }

        /* Action Buttons */
        .table-action-btns {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-view-pdf {
            background-color: #52af8d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.15s;
            white-space: nowrap;
        }

        .btn-view-pdf:hover {
            background-color: #429878;
        }

        .btn-download {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.15s;
        }

        .btn-download:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        .btn-delete-policy {
            background-color: #fff0f0;
            color: #dc3545;
            border: 1px solid #ffc9c9;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn-delete-policy:hover {
            background-color: #ffe3e3;
        }

        /* Empty State */
        .empty-row {
            text-align: center;
            padding: 35px !important;
            color: #868e96;
            font-style: italic;
        }

        /* ==========================================================================
           Popup Modals (Add Policy & View PDF)
           ========================================================================== */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1050;
            padding: 15px;
            overflow-y: auto;
        }

        .custom-modal-overlay.show {
            display: flex;
        }

        .custom-modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: modalFadeIn 0.2s ease-out;
            margin: auto;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .custom-modal-header {
            background-color: #52af8d;
            color: white;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .custom-modal-header h5 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
        }

        .custom-modal-body {
            padding: 18px 20px;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-row label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-row label span.required {
            color: #dc3545;
        }

        .form-row input[type="text"],
        .form-row textarea,
        .form-row input[type="file"] {
            width: 100%;
            font-size: 13px;
            padding: 9px 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
            font-family: inherit;
        }

        .form-row textarea {
            height: 95px;
            resize: vertical;
        }

        .form-row input:focus,
        .form-row textarea:focus {
            border-color: #52af8d;
            box-shadow: 0 0 0 3px rgba(82, 175, 141, 0.2);
        }

        .custom-modal-footer {
            padding: 12px 20px 16px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background-color: #f8f9fa;
        }

        .btn-modal-cancel {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-modal-apply {
            background-color: #52af8d;
            color: white;
            border: none;
            padding: 8px 22px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        /* PDF Viewer Modal */
        .pdf-modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 780px;
            height: 85vh;
            max-height: 850px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: auto;
        }

        .pdf-modal-body {
            flex: 1;
            overflow-y: auto;
            background-color: #f1f5f9;
            padding: 20px;
        }

        .pdf-sheet {
            background: #ffffff;
            max-width: 660px;
            margin: 0 auto;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            border-top: 4px solid #52af8d;
        }

        .pdf-sheet h3 {
            font-size: 18px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .pdf-sheet-date {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 18px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 8px;
        }

        .pdf-sheet-desc {
            font-size: 13px;
            line-height: 1.6;
            color: #333333;
            margin-bottom: 18px;
            word-break: break-word;
        }

        .pdf-sheet-clause {
            font-size: 13px;
            line-height: 1.6;
            color: #495057;
            margin-bottom: 14px;
            padding-left: 12px;
            border-left: 3px solid #52af8d;
        }

        /* ==========================================================================
           MOBILE SCREEN RESPONSIVE STYLING
           - 1 line header
           - Left panel: reduced size, 0 gap, no scroll
           - Center list: transforms into vertical cards, absolutely NO scroll
           ========================================================================== */
        @media (max-width: 767px) {

            /* 1. Header: All in ONE LINE, reduced text size */
            .header {
                height: 48px !important;
                min-height: 48px !important;
                padding: 4px 8px !important;
                display: flex !important;
                flex-wrap: nowrap !important;
                justify-content: space-between !important;
                align-items: center !important;
                overflow: hidden !important;
            }

            .header-left {
                gap: 4px !important;
                flex-shrink: 0 !important;
            }

            .logo-box {
                font-size: 12px !important;
                padding: 2px 5px !important;
                margin-right: 4px !important;
                border-radius: 3px !important;
            }

            .worklife-text {
                font-size: 14px !important;
                font-weight: 700 !important;
            }

            .header-right {
                gap: 5px !important;
                flex-wrap: nowrap !important;
                font-size: 11px !important;
                flex-shrink: 1 !important;
                min-width: 0 !important;
            }

            .header select {
                font-size: 10px !important;
                padding: 2px 3px !important;
                height: 24px !important;
                border-radius: 3px !important;
                max-width: 68px !important;
            }

            .header-right>span {
                font-size: 10px !important;
            }

            .header .profile {
                gap: 3px !important;
                font-size: 10px !important;
            }

            .header .profile i {
                font-size: 12px !important;
            }

            .username {
                font-size: 10px !important;
                max-width: 55px !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                white-space: nowrap !important;
            }

            .logout {
                padding: 2px !important;
                font-size: 12px !important;
            }

            /* 2. Left Panel: NO GAP, NO SCROLL, REDUCED SIZE */
            .main-container {
                flex-direction: column !important;
                padding: 8px 6px !important;
                gap: 8px !important;
            }

            .left-panel {
                flex-direction: row !important;
                width: 100% !important;
                gap: 0px !important;
                margin-top: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                border-radius: 4px !important;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12) !important;
            }

            .left-panel button {
                flex: 1 1 0px !important;
                min-width: 0 !important;
                width: auto !important;
                height: 48px !important;
                padding: 3px 2px !important;
                font-size: 10px !important;
                border-radius: 0px !important;
                border: none !important;
                border-right: 1px solid rgba(255, 255, 255, 0.18) !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .left-panel button:last-child {
                border-right: none !important;
            }

            .left-panel button:hover {
                transform: none !important;
                box-shadow: none !important;
            }

            .left-panel button div {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                width: 100% !important;
            }

            .left-panel button i {
                font-size: 15px !important;
                margin-top: 0 !important;
            }

            .left-panel button span {
                font-size: 9.5px !important;
                margin-top: 2px !important;
                line-height: 1 !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                max-width: 100% !important;
                display: block !important;
            }

            /* 3. Center Section & Table transformed into CARDS (NO SCROLL ON MOBILE) */
            .center-content {
                padding: 12px 10px !important;
                border-radius: 6px !important;
                margin-top: 0 !important;
            }

            .page-heading {
                font-size: 16px !important;
                margin-bottom: 10px !important;
                padding-bottom: 8px !important;
            }

            .policy-badge-count {
                font-size: 11px !important;
                padding: 2px 7px !important;
            }

            .top-action-bar {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 8px !important;
                margin-bottom: 12px !important;
            }

            .search-box-wrapper {
                max-width: 100% !important;
                width: 100% !important;
            }

            .search-box {
                font-size: 12px !important;
                padding: 7px 10px 7px 30px !important;
            }

            .btn-add-policy {
                width: 100% !important;
                padding: 8px 14px !important;
                font-size: 13px !important;
            }

            /* TRANSFORM TABLE INTO CARD LIST (NO HORIZONTAL SCROLL) */
            .table-responsive {
                overflow-x: visible !important;
                /* NO SCROLL */
            }

            .policy-list-table {
                min-width: 0 !important;
                width: 100% !important;
                display: block !important;
            }

            .policy-list-table thead {
                display: none !important;
                /* Hide headers */
            }

            .policy-list-table tbody {
                display: flex !important;
                flex-direction: column !important;
                gap: 10px !important;
                width: 100% !important;
            }

            .policy-list-table tr {
                display: flex !important;
                flex-direction: column !important;
                background: #ffffff !important;
                border: 1px solid #e2e8f0 !important;
                border-radius: 6px !important;
                padding: 12px !important;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05) !important;
                width: 100% !important;
            }

            .policy-list-table tr:hover {
                background-color: #ffffff !important;
            }

            .policy-list-table td {
                display: block !important;
                padding: 3px 0 !important;
                border: none !important;
                width: 100% !important;
            }

            /* Hide S.No table cell on mobile */
            .policy-list-table td:first-child {
                display: none !important;
            }

            .policy-item-title {
                font-size: 14px !important;
                font-weight: 700 !important;
                color: #212529 !important;
                margin-bottom: 2px !important;
            }

            .policy-item-desc {
                font-size: 12px !important;
                color: #555555 !important;
                line-height: 1.45 !important;
                margin: 4px 0 6px 0 !important;
            }

            .attachment-link {
                width: 100% !important;
                padding: 5px 8px !important;
                font-size: 11.5px !important;
                border-radius: 4px !important;
            }

            .attachment-link span {
                max-width: none !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
            }

            /* Action Buttons inside Mobile Card */
            .table-action-btns {
                margin-top: 8px !important;
                padding-top: 8px !important;
                border-top: 1px dashed #e2e8f0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-start !important;
                gap: 6px !important;
                width: 100% !important;
            }

            .btn-view-pdf {
                flex: 1 !important;
                justify-content: center !important;
                padding: 6px 10px !important;
                font-size: 12px !important;
            }

            .btn-download {
                flex: 1 !important;
                justify-content: center !important;
                padding: 6px 10px !important;
                font-size: 12px !important;
            }

            .btn-delete-policy {
                flex: 0 0 34px !important;
                height: 30px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 0 !important;
            }

            .pdf-modal-box {
                height: 90vh !important;
            }

            .pdf-sheet {
                padding: 14px !important;
            }

            .pdf-sheet h3 {
                font-size: 15px !important;
            }

            .pdf-modal-body {
                padding: 10px !important;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header">
            <!-- Left Section -->
            <div id="headerLogo" class="header-left" style="cursor: pointer;">
                <div class="logo-box">WL</div>
                <div class="worklife-text">Worklife</div>
            </div>

            <!-- Right Section -->
            <div class="header-right">
                <select>
                    <option>Eastern</option>
                    <option>Western</option>
                    <option>Northern</option>
                    <option>Southern</option>
                </select>
                <span>English</span>

                <!-- Profile Section -->
                <div class="profile">
                    <i class="fa-solid fa-circle-user"></i>
                    <span id="userName" style="text-transform: capitalize;">Loading...</span>
                </div>

                <!-- Logout Button -->
                <div class="logout" id="logoutBtn" title="Logout">
                    <i class="fas fa-power-off"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="main-container">
        <!-- Left Buttons: NO GAP, NO SCROLL, REDUCED SIZE ON MOBILE -->
        <div id="sidePanel" class="left-panel">
            <button class="btn-hr" id="hrBtn">
                <div>
                    <i class="fa-regular fa-user" style="font-size: 24px;"></i>
                    <span>HR</span>
                </div>
            </button>

            <button class="btn-finance" id="financeBtn">
                <div>
                    <i class="fa-regular fa-folder" style="font-size: 24px;"></i>
                    <span>Finance</span>
                </div>
            </button>

            <button class="btn-it" id="itBtn">
                <div>
                    <i class="fa-solid fa-desktop" style="font-size: 24px;"></i>
                    <span>IT</span>
                </div>
            </button>

            <button class="btn-pm" id="performanceBtn">
                <div>
                    <i class="fa-solid fa-clock" style="font-size: 24px;"></i>
                    <span>Performence</span>
                </div>
            </button>

            <button class="btn-reports" id="reportsBtn">
                <div>
                    <i class="fa-solid fa-chart-bar" style="font-size: 24px;"></i>
                    <span>Reports</span>
                </div>
            </button>
        </div>

        <!-- CENTER SECTION: TABLE ON DESKTOP, CARD ON MOBILE (NO SCROLL) -->
        <div class="center-content">
            <!-- Heading -->
            <div class="page-heading">
                <div class="page-heading-left">
                    <span>Company Policies</span>
                    <span class="policy-badge-count" id="policyCountBadge">0 Policies</span>
                </div>
            </div>

            <!-- Top Action Bar: Left Search & Right Add Option -->
            <div class="top-action-bar">
                <!-- Left side: Search option -->
                <div class="search-box-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="policySearchInput" class="search-box" placeholder="Search policies...">
                </div>

                <!-- Right side: Add option -->
                <button type="button" class="btn-add-policy" id="openAddModalBtn">
                    <i class="fa-solid fa-plus"></i>
                    Add Policy
                </button>
            </div>

            <!-- Policy List: Table on Desktop, Cards on Mobile -->
            <div class="table-responsive">
                <table class="policy-list-table">
                    <thead>
                        <tr>
                            <th style="width: 45px;">#</th>
                            <th style="width: 25%;">Policy Title</th>
                            <th style="width: 35%;">Description</th>
                            <th style="width: 18%;">Attachment</th>
                            <th style="width: 18%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="policyTableBody">
                        <!-- Dynamically populated from JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL: ADD POLICY -->
    <div class="custom-modal-overlay" id="addPolicyModalOverlay">
        <div class="custom-modal-box">
            <div class="custom-modal-header">
                <h5>Add Policy</h5>
                <button type="button" class="modal-close-x" id="closeAddModalX" title="Close">&times;</button>
            </div>

            <form id="addPolicyForm">
                <div class="custom-modal-body">
                    <div class="form-row">
                        <label for="policyTitle">Policies Title <span class="required">*</span></label>
                        <input type="text" id="policyTitle" placeholder="Enter policy title" required>
                    </div>

                    <div class="form-row">
                        <label for="policyDesc">Description <span class="required">*</span></label>
                        <textarea id="policyDesc" placeholder="Enter policy description..." required></textarea>
                    </div>

                    <div class="form-row">
                        <label for="policyAttachment">Attachment (PDF)</label>
                        <input type="file" id="policyAttachment" accept=".pdf,application/pdf">
                        <small style="color: #6c757d; font-size: 11px; margin-top: 3px; display: block;">Upload policy
                            document in PDF format</small>
                    </div>
                </div>

                <div class="custom-modal-footer">
                    <button type="button" class="btn-modal-cancel" id="cancelAddModalBtn">Cancel</button>
                    <button type="submit" class="btn-modal-apply" id="applyAddPolicyBtn">Apply</button>
                </div>
            </form>
        </div>
    </div>

    <!-- POPUP MODAL: VIEW PDF -->
    <div class="custom-modal-overlay" id="viewPdfModalOverlay">
        <div class="pdf-modal-box">
            <div class="custom-modal-header">
                <h5 id="viewPdfModalTitle"><i class="fa-solid fa-file-pdf me-2"></i>Policy Document</h5>
                <button type="button" class="modal-close-x" id="closeViewPdfX" title="Close">&times;</button>
            </div>
            <div class="pdf-modal-body" id="viewPdfModalContent">
                <!-- Document preview injected via JavaScript -->
            </div>
            <div class="custom-modal-footer">
                <button type="button" class="btn-download" id="modalDownloadPdfBtn">
                    <i class="fa-solid fa-download"></i> Download Document
                </button>
                <button type="button" class="btn-modal-cancel" id="closeViewPdfBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS: SESSION CHECK, USER LOGOUT & POLICY MANAGEMENT -->
    <script>
        // ----------------------------------------------------------------------
        // 1. Session check and sweet alert logout
        // ----------------------------------------------------------------------
        let currentLoginType = "normal";

        fetch("/api/auth/session-check", {
            credentials: "include"
        })
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = "index.html";
                    return;
                }

                currentLoginType = data.user.loginType || "normal";
                document.getElementById("userName").textContent = data.user.name;

                const header = document.getElementById("headerLogo");
                if (header) {
                    header.addEventListener("click", () => {
                        window.location.href =
                            data.user.roleId === 4
                                ? "employee-dashboard.html"
                                : "dashboard.html";
                    });
                }

                if (data.user.roleId === 4) {
                    const panel = document.getElementById("sidePanel");
                    if (panel) {
                        panel.innerHTML = `
                            <button class="btn-hr" id="leaveBtn">
                                <div><i class="fa-solid fa-calendar-check"></i><span>Leave</span></div>
                            </button>
                            <button class="btn-finance" id="expenseBtn">
                                <div><i class="fa-solid fa-money-bill"></i><span>Expense</span></div>
                            </button>
                            <button class="btn-reports" id="performanceBtn2">
                                <div><i class="fa-solid fa-chart-column"></i><span>Performance</span></div>
                            </button>
                            <button class="btn-it" id="petrolBtn">
                                <div><i class="fa-solid fa-gas-pump"></i><span>Petrol</span></div>
                            </button>
                            <button class="btn-pm" id="salesBtn">
                                <div><i class="fa-solid fa-chart-line"></i><span>Incentive</span></div>
                            </button>
                            <button class="btn-reports" style="background-color:#0d6efd;" id="certificateBtn">
                                <div><i class="fa-solid fa-certificate"></i><span>Certificate</span></div>
                            </button>
                        `;

                        document.getElementById("leaveBtn")?.addEventListener("click", () => { window.location.href = "LeaveRequest.html"; });
                        document.getElementById("expenseBtn")?.addEventListener("click", () => { window.location.href = "expense-claim.html"; });
                        document.getElementById("performanceBtn2")?.addEventListener("click", () => { window.location.href = "performance.html"; });
                        document.getElementById("petrolBtn")?.addEventListener("click", () => { window.location.href = "petrol-conveyance.html"; });
                        document.getElementById("salesBtn")?.addEventListener("click", () => { window.location.href = "sales.html"; });
                        document.getElementById("certificateBtn")?.addEventListener("click", () => { window.location.href = "certificate.html"; });
                    }
                }
            })
            .catch(error => {
                console.error("Session check failed:", error);
                const u = document.getElementById("userName");
                if (u && u.textContent === "Loading...") {
                    u.textContent = "Admin";
                }
            });

        // ----------------------------------------------------------------------
        // 2. Left panel static clicks & Logout
        // ----------------------------------------------------------------------
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("logoutBtn")?.addEventListener("click", logoutUser);
            document.getElementById("hrBtn")?.addEventListener("click", () => window.location.href = "humanresource.html?section=hr-logo");
            document.getElementById("financeBtn")?.addEventListener("click", () => window.location.href = "humanresource.html?section=finance-logo");
            document.getElementById("itBtn")?.addEventListener("click", () => window.location.href = "humanresource.html?section=it-logo");
            document.getElementById("performanceBtn")?.addEventListener("click", () => window.location.href = "humanresource.html?section=performance-logo");
            document.getElementById("reportsBtn")?.addEventListener("click", () => window.location.href = "humanresource.html?section=reports-logo");
        });

        function logoutUser() {
            if (typeof Swal !== "undefined") {
                Swal.fire({
                    title: "Are you sure?",
                    text: "You will be logged out from your session.",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "Yes, logout",
                    cancelButtonText: "Cancel"
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch("/api/auth/logout")
                            .then(res => res.json())
                            .then(data => {
                                if (data.success) {
                                    Swal.fire({
                                        title: "Logged Out!",
                                        text: "You have been successfully logged out.",
                                        icon: "success",
                                        showConfirmButton: false,
                                        timer: 2000
                                    });
                                    setTimeout(() => {
                                        window.location.href = (currentLoginType === "accounts") ? "accounts-login.html" : "index.html";
                                    }, 2000);
                                } else {
                                    Swal.fire("Oops!", "Logout failed. Try again.", "error");
                                }
                            })
                            .catch(err => {
                                window.location.href = "index.html";
                            });
                    }
                });
            } else {
                if (confirm("Are you sure you want to log out?")) {
                    window.location.href = "index.html";
                }
            }
        }



        let policies = [];
        let searchQuery = "";
        let currentViewingPolicy = null;

        const policyTableBody = document.getElementById("policyTableBody");
        const policySearchInput = document.getElementById("policySearchInput");
        const policyCountBadge = document.getElementById("policyCountBadge");

        const addPolicyModalOverlay = document.getElementById("addPolicyModalOverlay");
        const openAddModalBtn = document.getElementById("openAddModalBtn");
        const closeAddModalX = document.getElementById("closeAddModalX");
        const cancelAddModalBtn = document.getElementById("cancelAddModalBtn");
        const addPolicyForm = document.getElementById("addPolicyForm");
        const policyTitle = document.getElementById("policyTitle");
        const policyDesc = document.getElementById("policyDesc");
        const policyAttachment = document.getElementById("policyAttachment");

        const viewPdfModalOverlay = document.getElementById("viewPdfModalOverlay");
        const viewPdfModalTitle = document.getElementById("viewPdfModalTitle");
        const viewPdfModalContent = document.getElementById("viewPdfModalContent");
        const closeViewPdfX = document.getElementById("closeViewPdfX");
        const closeViewPdfBtn = document.getElementById("closeViewPdfBtn");
        const modalDownloadPdfBtn = document.getElementById("modalDownloadPdfBtn");


        async function loadPolicies() {
            try {
                const response = await fetch("/api/policies", {
                    credentials: "include"
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Failed to load policies.");
                }

                policies = data.policies || [];

                renderPolicies();

            } catch (error) {
                console.error("Load policies error:", error);

                policyTableBody.innerHTML = `
                <tr>
                <td colspan="5" class="empty-row">
                    Failed to load policies.
                </td>
                </tr>
                `;
            }
        }



        function renderPolicies() {
            const list = policies;
            const filtered = list.filter(p => {
                const q = searchQuery.toLowerCase().trim();
                if (!q) return true;
                return p.title.toLowerCase().includes(q) ||
                    p.description.toLowerCase().includes(q) ||
                    (p.file_name && p.file_name.toLowerCase().includes(q));
            });

            policyCountBadge.textContent = `${list.length} ${list.length === 1 ? 'Policy' : 'Policies'}`;

            if (filtered.length === 0) {
                policyTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-row">
                            <i class="fa-solid fa-folder-open me-2"></i>No policies found matching "${escapeHtml(searchQuery)}".
                        </td>
                    </tr>
                `;
                return;
            }

            policyTableBody.innerHTML = filtered.map((policy, idx) => {
                const fileName = policy.file_name || 'Document.pdf';
                const fileSize = policy.file_size
                    ? (policy.file_size / (1024 * 1024)).toFixed(1) + " MB"
                    : "0 KB";

                return `
                    <tr>
                        <td style="color: #6c757d; font-weight: 500;">${idx + 1}</td>
                        <td>
                            <div class="policy-item-title">${escapeHtml(policy.title)}</div>
                            <small style="color: #adb5bd; font-size: 11px;"><i class="fa-regular fa-calendar-alt me-1"></i>
                                ${policy.created_at
                        ? new Date(policy.created_at).toLocaleDateString('en-US', {
                            month: 'short',
                            day: '2-digit',
                            year: 'numeric'
                        })
                        : 'Active'}
                        </small>
                        </td>
                        <td>
                            <div class="policy-item-desc">${escapeHtml(policy.description)}</div>
                        </td>
                        <td>
                            <div class="attachment-link view-policy-btn" data-id="${policy.id}" title="Click to view PDF">
                                <i class="fa-solid fa-file-pdf"></i>
                                <span>${escapeHtml(fileName)}</span>
                            </div>
                            <div style="font-size: 11px; color: #adb5bd; margin-top: 3px;">${fileSize}</div>
                        </td>
                        <td>
                            <div class="table-action-btns justify-content-center">
                                <button type="button" class="btn-view-pdf view-policy-btn" data-id="${policy.id}" title="View PDF">
                                    <i class="fa-solid fa-eye"></i> View PDF
                                </button>
                                <button type="button" class="btn-download download-policy-btn" data-id="${policy.id}" title="Download">
                                    <i class="fa-solid fa-download"></i>
                                </button>
                                <button type="button" class="btn-delete-policy delete-policy-btn" data-id="${policy.id}" title="Delete Policy">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // Button Onclick
            // Attach button click events
            document.querySelectorAll(".view-policy-btn").forEach(btn => {
                btn.addEventListener("click", function () {
                    openPdfModal(this.dataset.id);
                });
            });

            document.querySelectorAll(".download-policy-btn").forEach(btn => {
                btn.addEventListener("click", function () {
                    downloadPolicyFile(this.dataset.id);
                });
            });

            document.querySelectorAll(".delete-policy-btn").forEach(btn => {
                btn.addEventListener("click", function () {
                    deletePolicy(this.dataset.id);
                });
            });

        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        policySearchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            renderPolicies();
        });

        function openAddModal() {
            addPolicyModalOverlay.classList.add("show");
            policyTitle.focus();
        }

        function closeAddModal() {
            addPolicyModalOverlay.classList.remove("show");
            addPolicyForm.reset();
        }

        openAddModalBtn.addEventListener("click", openAddModal);
        closeAddModalX.addEventListener("click", closeAddModal);
        cancelAddModalBtn.addEventListener("click", closeAddModal);

        addPolicyModalOverlay.addEventListener("click", (e) => {
            if (e.target === addPolicyModalOverlay) {
                closeAddModal();
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeAddModal();
                closePdfModal();
            }
        });



        addPolicyForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            const title = policyTitle.value.trim();
            const description = policyDesc.value.trim();
            const file = policyAttachment.files[0];


            if (!title || !description) {

                Swal.fire(
                    "Required",
                    "Please fill in both Policy Title and Description.",
                    "warning"
                );

                return;
            }


            if (!file) {

                Swal.fire(
                    "Required",
                    "Please upload a PDF policy document.",
                    "warning"
                );

                return;
            }


            if (file.type !== "application/pdf") {

                Swal.fire(
                    "Invalid File",
                    "Only PDF files are allowed.",
                    "error"
                );

                return;
            }


            const formData = new FormData();

            formData.append("title", title);
            formData.append("description", description);
            formData.append("attachment", file);


            try {

                const response = await fetch("/api/policies", {

                    method: "POST",

                    credentials: "include",

                    body: formData

                });


                const data = await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message || "Failed to add policy."
                    );
                }


                closeAddModal();

                await loadPolicies();


                Swal.fire({

                    title: "Added!",

                    text: "Policy added successfully.",

                    icon: "success",

                    timer: 1500,

                    showConfirmButton: false

                });

            } catch (error) {

                console.error("Add policy error:", error);

                Swal.fire(
                    "Error",
                    error.message || "Failed to add policy.",
                    "error"
                );

            }

        });

        window.deletePolicy = function (id) {

            const doDelete = async () => {

                try {

                    const response = await fetch(
                        `/api/policies/${id}`,
                        {
                            method: "DELETE",
                            credentials: "include"
                        }
                    );


                    const data = await response.json();


                    if (!response.ok || !data.success) {

                        throw new Error(
                            data.message || "Failed to delete policy."
                        );
                    }


                    await loadPolicies();


                    Swal.fire({

                        title: "Deleted!",

                        text: "Policy deleted successfully.",

                        icon: "success",

                        timer: 1500,

                        showConfirmButton: false

                    });

                } catch (error) {

                    console.error("Delete policy error:", error);

                    Swal.fire(
                        "Error",
                        error.message || "Failed to delete policy.",
                        "error"
                    );

                }

            };


            Swal.fire({

                title: "Delete Policy?",

                text: "Are you sure you want to remove this policy?",

                icon: "warning",

                showCancelButton: true,

                confirmButtonColor: "#d33",

                cancelButtonColor: "#3085d6",

                confirmButtonText: "Yes, delete"

            }).then((result) => {

                if (result.isConfirmed) {

                    doDelete();

                }

            });

        };

        window.openPdfModal = function (id) {

            const policy = policies.find(
                p => Number(p.id) === Number(id)
            );

            if (!policy) return;


            currentViewingPolicy = policy;


            viewPdfModalTitle.innerHTML = `
        <i class="fa-solid fa-file-pdf me-2 text-danger"></i>
        ${escapeHtml(policy.title)}
    `;


            viewPdfModalContent.innerHTML = `
        <iframe
            src="${policy.file_path}"
            style="
                width:100%;
                height:100%;
                min-height:600px;
                border:none;
            "
        ></iframe>
    `;


            viewPdfModalOverlay.classList.add("show");

        };

        function closePdfModal() {
            viewPdfModalOverlay.classList.remove("show");
            currentViewingPolicy = null;
        }

        closeViewPdfX.addEventListener("click", closePdfModal);
        closeViewPdfBtn.addEventListener("click", closePdfModal);
        viewPdfModalOverlay.addEventListener("click", (e) => {
            if (e.target === viewPdfModalOverlay) {
                closePdfModal();
            }
        });

        window.downloadPolicyFile = function (id) {

            const policy = policies.find(
                p => Number(p.id) === Number(id)
            );

            if (!policy) return;


            const a = document.createElement("a");

            a.href = policy.file_path;

            a.download = policy.file_name || "Policy.pdf";

            a.target = "_blank";

            document.body.appendChild(a);

            a.click();

            a.remove();

        };

        modalDownloadPdfBtn.addEventListener("click", () => {
            if (currentViewingPolicy) {
                downloadPolicyFile(currentViewingPolicy.id);
            }
        });


        loadPolicies();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
